<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | Golden Hour Candles</title>

    <link rel="stylesheet" href="style.css">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>

<header>
    <div class="logo">
        <h1>Golden Hour Candles</h1>
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="shop.html">Shop</a>
        <a href="about.html">About Us</a>
        <a href="contact.html">Contact Us</a>
        <a href="cart.html" class="active">Cart</a>
    </nav>
</header>

<main class="cart-container">
    <section class="cart-header">
        <h1>Your Shopping Cart</h1>
    </section>

    <section class="cart-content">
        <!-- Cart Items Table/List -->
        <div class="cart-items" id="cart-items">
            <!-- JavaScript se cart products yahan render hongay -->
            <p class="empty-cart-msg">Your cart is currently empty.</p>
        </div>

        <!-- Cart Summary / Total -->
        <div class="cart-summary">
            <h2>Order Summary</h2>
            <div class="summary-details">
                <div class="summary-line">
                    <span>Subtotal:</span>
                    <span>Rs. <span id="cart-total">0</span></span>
                </div>
                <div class="summary-line">
                    <span>Shipping:</span>
                    <span>Calculated at checkout</span>
                </div>
                <hr>
                <div class="summary-line total">
                    <strong>Total:</strong>
                    <strong>Rs. <span id="cart-total-final">0</span></strong>
                </div>
            </div>

            <div class="cart-actions">
                <a href="shop.html" class="btn-secondary">Continue Shopping</a>
                <button class="btn-primary" id="checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </section>
</main>

<footer>
    <p>&copy; 2026 Golden Hour Candles. All Rights Reserved.</p>
</footer>

<!-- Floating WhatsApp -->
<a href="https://wa.me/923047216608" target="_blank" class="floating-whatsapp" aria-label="Contact us on WhatsApp">
    <i class="fa-brands fa-whatsapp"></i>
</a>

<!-- Cart Functionality Script -->
<script src="script.js"></script>

</body>
</html>
