<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Glow Craft Candles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #faf8f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

    <!-- Navigation Bar -->
    <header style="background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
        <h1 style="color: #5c3d2e; margin: 0; font-family: 'Georgia', serif; font-size: 1.8rem;">Glow Craft Candles</h1>
        <nav>
            <a href="index.html" style="margin-right: 20px; text-decoration: none; color: #8c6239;">Home</a>
            <a href="shop.html" style="margin-right: 20px; text-decoration: none; color: #8c6239;">Shop</a>
            <a href="cart.html" style="text-decoration: none; color: #8c6239; font-weight: bold;">Cart</a>
        </nav>
    </header>

    <!-- Main Content Wrapper -->
    <main style="flex: 1; padding: 20px;">
        <div style="max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 style="color: #5c3d2e; text-align: center; margin-bottom: 30px; font-family: 'Georgia', serif;">Checkout</h2>
            
            <!-- Form (Formspree k sath linked kiya hai order details email par mangwane ke liye) -->
            <form action="https://formspree.io/f/xaqrqwel" method="POST" id="checkout-form">
                
                <!-- Customer Name -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">Full Name</label>
                    <input type="text" name="name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <!-- Phone Number -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">Phone Number</label>
                    <input type="tel" name="phone" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <!-- Address -->
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">Shipping Address</label>
                    <textarea name="address" rows="3" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
                </div>

                <!-- City -->
                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">City</label>
                    <input type="text" name="city" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <!-- Hidden inputs to submit Cart Items and Total Price -->
                <input type="hidden" name="Order Details" id="order-details-input">
                <input type="hidden" name="Total Amount" id="total-amount-input">

                <!-- Payment Method Information -->
                <div style="background: #faf8f5; padding: 15px; border-left: 4px solid #8c6239; margin-bottom: 25px; border-radius: 4px;">
                    <p style="margin: 0; font-weight: bold; color: #5c3d2e;">Payment Method:</p>
                    <p style="margin: 5px 0 0 0; color: #666; font-size: 0.95rem;">Cash on Delivery (COD)</p>
                </div>

                <!-- Place Order Button -->
                <button type="submit" style="width: 100%; background-color: #8c6239; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer;">
                    Place Order (Cash on Delivery)
                </button>
            </form>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background-color: #4a3728; color: #fff; text-align: center; padding: 1rem; margin-top: auto;">
        <p>&copy; 2026 Glow Craft Candles. All rights reserved.</p>
    </footer>

    <!-- JS script to attach cart details inside form before sending -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const savedCart = JSON.parse(localStorage.getItem('cart')) || [];
            let total = 0;
            let orderText = "";

            savedCart.forEach(item => {
                const qty = item.quantity || 1;
                const itemTotal = item.price * qty;
                total += itemTotal;
                orderText += `${item.name} (Qty: ${qty}) - Rs. ${itemTotal}\n`;
            });

            // Set hidden input values
            document.getElementById('order-details-input').value = orderText;
            document.getElementById('total-amount-input').value = "Rs. " + total;

            // Form submit hone par local storage clean karna
            document.getElementById('checkout-form').addEventListener('submit', () => {
                localStorage.clear(); // Clear cart once order is placed
            });
        });
    </script>
</body>
</html>
