<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart - GlowCraft Candles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header>
        <div class="logo">
            <h1>GlowCraft Candles</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact Us</a>
            <a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- Cart Main Content -->
    <section class="cart-section">
        <h2>Shopping Cart</h2>
        <div id="cart-items" class="cart-items-container">
            <!-- Dynamic Cart Items Will Load Here -->
        </div>
        
        <div class="cart-summary">
            <h3>Total: Rs. <span id="cart-total">0</span></h3>
            <a href="checkout.html" class="btn checkout-btn">Proceed to Checkout</a>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 GlowCraft Candles. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
