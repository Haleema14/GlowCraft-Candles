<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Glow Craft Candles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #faf8f5;">

    <!-- Header & Navigation -->
    <header style="background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <div class="logo">
            <h1>GlowCraft Candles</h1>
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="about.html">About Us</a>
            <a href="contact.html" style="font-weight: bold;">Contact Us</a>
            <a href="cart.html" class="cart-link">Cart (<span id="cart-count">0</span>)</a>
        </nav>
    </header>

    <!-- Contact Form Container -->
    <div style="max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
        <h2 style="color: #5c3d2e; text-align: center; margin-bottom: 20px;">Get in Touch</h2>
        
        <form action="https://formspree.io/f/xaqrqwel" method="POST">
            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #5c3d2e;">Your Name</label>
                <input type="text" name="name" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 15px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #5c3d2e;">Email Address</label>
                <input type="email" name="email" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div style="margin-bottom: 20px;">
                <label style="display: block; margin-bottom: 5px; font-weight: bold; color: #5c3d2e;">Message</label>
                <textarea name="message" rows="4" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
            </div>

            <button type="submit" style="width: 100%; background-color: #8c6239; color: white; padding: 12px; border: none; border-radius: 4px; font-size: 1rem; cursor: pointer;">Send Message</button>
        </form>

        <!-- Direct WhatsApp Option -->
        <div style="text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee;">
            <p style="color: #666; margin-bottom: 10px;">Need quick assistance?</p>
            <a href="https://wa.me/923000000000?text=Hi%20GlowCraft,%20I%20have%20a%20query!" target="_blank" style="display: inline-block; background-color: #25D366; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold;">
                Chat on WhatsApp
            </a>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 GlowCraft Candles. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
