<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Glow Craft Candles</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="background-color: #faf8f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; min-height: 100vh; margin: 0;">

    <!-- Navigation Bar -->
    <header style="background: white; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); display: flex; justify-content: space-between; align-items: center;">
        <h1 style="color: #5c3d2e; margin: 0; font-family: 'Georgia', serif; font-size: 1.8rem;">Glow Craft Candles</h1>
        <nav>
            <a href="index.html" style="margin-right: 20px; text-decoration: none; color: #8c6239;">Home</a>
            <a href="shop.html" style="margin-right: 20px; text-decoration: none; color: #8c6239;">Shop</a>
            <a href="about.html" style="margin-right: 20px; text-decoration: none; color: #8c6239;">About Us</a>
            <a href="contact.html" style="margin-right: 20px; text-decoration: none; color: #8c6239; font-weight: bold;">Contact Us</a>
            <a href="cart.html" style="text-decoration: none; color: #8c6239;">Cart</a>
        </nav>
    </header>

    <!-- Main Content Wrapper -->
    <main style="flex: 1; padding: 20px;">
        <div style="max-width: 600px; margin: 40px auto; padding: 30px; background: white; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
            <h2 style="color: #5c3d2e; text-align: center; margin-bottom: 30px; font-family: 'Georgia', serif;">Contact Us</h2>
            
            <form action="https://formspree.io/f/xaqrqwel" method="POST">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">Your Name</label>
                    <input type="text" name="name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">Your Email</label>
                    <input type="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; margin-bottom: 8px; font-weight: bold; color: #5c3d2e;">Message</label>
                    <textarea name="message" rows="4" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
                </div>

                <button type="submit" style="width: 100%; background-color: #8c6239; color: white; border: none; padding: 14px; font-size: 1rem; font-weight: bold; border-radius: 4px; cursor: pointer;">
                    Send Message
                </button>
            </form>

            <!-- Direct WhatsApp Option -->
            <div style="text-align: center; margin-top: 25px; padding-top: 15px; border-top: 1px solid #eee;">
                <p style="color: #666; margin-bottom: 10px;">Need quick assistance?</p>
                <a href="https://wa.me/923000000000?text=Hi%20GlowCraft,%20I%20have%20a%20query!" target="_blank" style="color: #25d366; text-decoration: none; font-weight: bold;">
                    Chat on WhatsApp
                </a>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer style="background-color: #4a3728; color: #fff; text-align: center; padding: 1rem; margin-top: auto;">
        <p>&copy; 2026 Glow Craft Candles. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
